<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGM Express - Top Up & Kasbon Kilat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#0ea5e9', 600: '#0284c7' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl my-auto">
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-tr from-sky-500 to-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-sky-500/30 text-white text-2xl font-bold">
                <i class="fas fa-bolt"></i>
            </div>
            <h1 class="text-xl font-extrabold text-white">PGM EXPRESS</h1>
            <p class="text-xs text-slate-400 mt-1">Layanan Top-Up, DANA Cashbon & Jasa Digital Kilat</p>
        </div>

        <!-- Form Transaksi -->
        <form id="orderForm" onsubmit="kirimPesanan(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap</label>
                <input type="text" id="nama" required placeholder="Masukkan nama kamu" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Nomor WhatsApp (Aktif)</label>
                <input type="tel" id="whatsapp" required placeholder="08xxxxxxxxxx" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Jenis Layanan</label>
                    <select id="jenis" onchange="toggleJenisLayanan()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
                        <option value="DIRECT">Top-Up Direct</option>
                        <option value="KASBON">DANA Kasbon</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Nominal / Saldo</label>
                    <input type="text" id="dana" required placeholder="Cth: 50.000" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
                </div>
            </div>

            <!-- Bagian Khusus Kasbon (Sembunyikan jika Direct) -->
            <div id="kasbonSection" class="hidden space-y-4 p-4 rounded-2xl bg-slate-950/60 border border-slate-800">
                <div class="text-amber-400 text-xs font-bold flex items-center gap-1.5">
                    <i class="fas fa-triangle-exclamation"></i> Syarat & Ketentuan Kasbon
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Upload / Ambil Foto KTP</label>
                    <input type="file" id="fotoKtp" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-500/20 file:text-sky-400 hover:file:bg-sky-500/30 cursor-pointer">
                </div>
                <div>
                    <button type="button" onclick="ambilLokasiGPS()" class="w-full py-2.5 px-4 bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fas fa-map-marker-alt"></i> <span id="gpsStatusText">Ambil Lokasi GPS Terkini</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-sky-500/20 text-sm cursor-pointer">
                Kirim Pesanan / Ajukan Sekarang
            </button>
        </form>
    </div>

    <footer class="text-center text-[11px] text-slate-500 mt-4">
        &copy; 2026 PGM Express &bull; Cirebon, Jawa Barat
    </footer>

    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            databaseURL: "https://pgm-express-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let latitudeData = null;
        let longitudeData = null;
        let mapsUrlData = null;
        let ktpBase64 = null;

        function toggleJenisLayanan() {
            const jenis = document.getElementById('jenis').value;
            const kasbonSec = document.getElementById('kasbonSection');
            if (jenis === 'KASBON') {
                kasbonSec.classList.remove('hidden');
            } else {
                kasbonSec.classList.add('hidden');
            }
        }

        document.getElementById('fotoKtp').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    ktpBase64 = reader.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function ambilLokasiGPS() {
            if (navigator.geolocation) {
                document.getElementById('gpsStatusText').innerText = 'Mengambil GPS...';
                navigator.geolocation.getCurrentPosition((position) => {
                    latitudeData = position.coords.latitude;
                    longitudeData = position.coords.longitude;
                    mapsUrlData = `https://www.google.com/maps?q=${latitudeData},${longitudeData}`;
                    document.getElementById('gpsStatusText').innerText = 'GPS Berhasil Diambil!';
                }, (error) => {
                    alert('Gagal mengambil GPS: ' + error.message);
                    document.getElementById('gpsStatusText').innerText = 'Ambil Lokasi GPS Terkini';
                });
            } else {
                alert('Geolocation tidak didukung browser ini.');
            }
        }

        function kirimPesanan(e) {
            e.preventDefault();
            const nama = document.getElementById('nama').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const jenis = document.getElementById('jenis').value;
            const dana = document.getElementById('dana').value;

            if (jenis === 'KASBON' && (!latitudeData || !ktpBase64)) {
                alert('Untuk Kasbon, mohon lengkapi Foto KTP dan ambil Lokasi GPS terlebih dahulu!');
                return;
            }

            const dataBaru = {
                nama: nama,
                whatsapp: whatsapp,
                noHp: whatsapp,
                jenis: jenis,
                dana: dana,
                totalTagihan: parseInt(dana.replace(/\D/g, '')) || 50000,
                tanggal: new Date().toLocaleString('id-ID'),
                status: 'PENDING',
                latitude: latitudeData || '',
                longitude: longitudeData || '',
                mapsUrl: mapsUrlData || '',
                fotoKtp: ktpBase64 || ''
            };

            db.ref('transaksi').push(dataBaru).then(() => {
                alert('Pesanan berhasil dikirim ke Admin PGM Express!');
                document.getElementById('orderForm').reset();
                toggleJenisLayanan();
            }).catch(err => {
                alert('Gagal mengirim: ' + err.message);
            });
        }
    </script>
</body>
</html>
